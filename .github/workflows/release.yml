name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Check out release
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up Python
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validator
        if: steps.release.outputs.release_created == 'true'
        run: pip install --requirement requirements-dev.txt

      - name: Check release
        if: steps.release.outputs.release_created == 'true'
        run: python3 scripts/validate.py

      - name: Add files to release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          mapfile -t schema_files < <(find schemas -maxdepth 1 -type f -name '*.json' -print | sort)
          if [[ ! -f quotes.json || ${#schema_files[@]} -eq 0 ]]; then
            echo "Release files are missing." >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" quotes.json "${schema_files[@]}" --clobber
